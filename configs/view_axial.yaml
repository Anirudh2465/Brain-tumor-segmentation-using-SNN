# Axial view — slices along the z-axis (depth)
view:
  name: axial
  axis: 2           # numpy axis index in the (H, W, D) cropped volume
  num_slices: 152   # D after crop (see D2 in DEVIATIONS.md — assumption)
  slice_H: 160      # spatial height of each 2D slice
  slice_W: 192      # spatial width of each 2D slice
