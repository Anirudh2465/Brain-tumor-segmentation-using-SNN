[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiking-useg-net"
version = "0.1.0"
description = "Spiking U-Seg-Net for brain tumor segmentation (BraTS 2023)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "nibabel",
    "scikit-image",
    "scipy",
    "monai",
    "pyyaml",
    "tqdm",
    "tensorboard",
    "openpyxl",
    "matplotlib",
    "pandas",
    "fvcore",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
